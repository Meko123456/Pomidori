name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The unit tests live with the code they test: the timer in :timer, the tile's words in :wear.
      - name: Build, lint and unit tests
        run: ./gradlew :timer:test :app:assembleDebug :app:lintDebug :wear:testDebugUnitTest :wear:assembleDebug :wear:lintDebug --stacktrace

      # Debug builds never run R8, so the shrinker was configured here and never once executed.
      # Without this step, the first time code shrinking runs is release day, which is the worst
      # possible day to learn it removed something the app needed. lintVitalRelease is the
      # release-blocking subset of lint, which debug lint does not cover either.
      - name: Release build (R8 + release-blocking lint)
        run: ./gradlew :app:assembleRelease :app:lintVitalRelease :wear:assembleRelease :wear:lintVitalRelease --stacktrace

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            wear/build/reports/lint-results-debug.html

  release-launches:
    # Building the release proves R8 ran, not that the result starts. On 30 September 2026 three
    # apps in this collection turned out to have minified builds that died before their first frame
    # (R8 full mode had stripped a constructor a library reaches for by reflection), and every check
    # was green. This installs the R8 build on an emulator, opens it, and fails if it crashes or is
    # not running fifteen seconds later. Proven both ways in Nabiji #13.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # CI has no release key, so the build comes out unsigned. Any key will do for installing it
      # on a throwaway emulator, so this makes one up.
      - name: Build the minified release and sign it with a throwaway key
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          keytool -genkeypair -keystore "$RUNNER_TEMP/launch.jks" -storepass launchcheck \
            -keypass launchcheck -alias launch -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=release launch check"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 "$(ls app/build/outputs/apk/release/*.apk | head -1)" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/launch.jks" --ks-pass pass:launchcheck \
            --key-pass pass:launchcheck --out "$RUNNER_TEMP/release.apk" "$RUNNER_TEMP/aligned.apk"

      # The emulator wants more disk than ubuntu-latest leaves free, and it needs KVM.
      - name: Free disk space and enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup \
                      /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the release build on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/launch-release.sh ${{ runner.temp }}/release.apk
